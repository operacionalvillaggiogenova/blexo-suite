<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="orcamentos.css"><title>Blexo Suite — Orçamentos</title></head><body><header><a href="index.html">← Blexo Suite</a><div><span id="syncStatus">Local</span><button id="syncBtn">↻ Google Drive</button></div></header><main><section id="home"><div class="hero"><p>ORÇAMENTOS</p><h1>Propostas com evidências</h1><button id="newBtn">＋ Novo orçamento</button></div><input id="search" placeholder="Pesquisar orçamento, cliente ou serviço"><div id="list"></div></section><section id="editor" hidden><div class="bar"><button id="backBtn">← Voltar</button><button id="pdfBtn">📄 Gerar PDF</button></div><div class="card"><h2>1. Cliente</h2><input id="client" placeholder="Nome / empresa"><input id="doc" placeholder="CPF / CNPJ"><input id="phone" placeholder="Telefone / WhatsApp"><input id="email" placeholder="E-mail"><textarea id="address" placeholder="Endereço"></textarea></div><div class="card"><h2>2. Serviço</h2><input id="title" placeholder="Título do orçamento"><textarea id="description" placeholder="Descrição do serviço"></textarea><input id="validity" placeholder="Validade da proposta"><input id="deadline" placeholder="Prazo de execução"></div><div class="card"><h2>3. Itens e valores</h2><div id="items"></div><button id="addItem">＋ Item</button><div class="total">Total <strong id="total">R$ 0,00</strong></div><input id="payment" placeholder="Forma de pagamento"></div><div class="card"><h2>4. Evidências fotográficas</h2><p>Fotos de defeitos, peças ou locais. Cada foto pode receber uma observação.</p><div id="groups"></div><button id="addGroup">＋ Bloco de evidências</button></div><div class="card"><h2>5. Observações</h2><textarea id="notes" placeholder="Garantia, materiais, condições ou informações adicionais"></textarea></div></section></main><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="config.js"></script><script src="google-sync.js"></script><script src="orcamentos.js"></script></body></html>
